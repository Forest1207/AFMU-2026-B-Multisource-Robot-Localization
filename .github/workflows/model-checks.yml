name: model-checks

on:
  push:
    branches:
      - main
      - agent/reference-submission-solution
  pull_request:

permissions:
  contents: write

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q 03_models scripts src

      - name: Validate committed input manifest syntax
        run: python scripts/audit_inputs.py --allow-missing --json /tmp/input-audit.json

      - name: Q1 synthetic recovery
        run: python 03_models/q1/test_synthetic.py

      - name: Q2 synthetic recovery
        run: python 03_models/q2/test_synthetic.py

      - name: Q3 synthetic recovery
        run: python 03_models/q3/test_synthetic.py

      - name: Q4 target-coverage scheduler synthetic test
        run: python 03_models/q4/test_synthetic.py

      - name: Verify legacy Q4 results cannot silently enter paper build
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('05_results/q4/parameters.json')
          if p.exists():
              q4 = json.loads(p.read_text(encoding='utf-8'))
              if q4.get('milp', {}).get('artificial_capacity') is not None:
                  print('Legacy Q4 result is present. Formal paper/package audit will reject it until refresh.')
          PY

  refresh-formal-q4:
    needs: synthetic-tests
    if: >-
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/reference-submission-solution') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/agent/reference-submission-solution' &&
       contains(github.event.head_commit.message, '[refresh-q4]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/reference-submission-solution
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Audit committed official inputs
        run: python scripts/audit_inputs.py --data-dir 00_problem/attachments

      - name: Recompute formal unrestricted Q4
        run: |
          python 03_models/q4/run_q4.py \
            --trajectory 05_results/q3/trajectory_10hz.csv \
            --targets 00_problem/attachments/附件4.xlsx \
            --template 00_problem/attachments/result.xlsx \
            --results 05_results/q4

      - name: Regenerate Q4 figures
        run: |
          python 03_models/q4/make_figures.py \
            --trajectory 05_results/q3/trajectory_10hz.csv \
            --targets 00_problem/attachments/附件4.xlsx \
            --results 05_results/q4 \
            --figures 06_figures/q4

      - name: Validate formal Q4
        run: |
          python 03_models/q4/validation.py \
            --trajectory 05_results/q3/trajectory_10hz.csv \
            --targets 00_problem/attachments/附件4.xlsx \
            --template 00_problem/attachments/result.xlsx \
            --results 05_results/q4 \
            --figures 06_figures/q4 \
            --output 05_results/q4/validation.json

      - name: Audit formal result chain
        run: python scripts/audit_results.py --output-dir /tmp/formal-audit

      - name: Validate fresh Q4 against LaTeX asset generator
        run: python scripts/generate_latex_assets.py

      - name: Commit refreshed formal Q4 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 05_results/q4 06_figures/q4
          if git diff --cached --quiet; then
            echo "No Q4 artifact changes to commit."
          else
            git commit -m "Refresh unrestricted formal Q4 results"
            git push origin HEAD:agent/reference-submission-solution
          fi
