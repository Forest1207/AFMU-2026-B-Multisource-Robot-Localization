name: model-checks

on:
  push:
    branches:
      - main
      - agent/reference-submission-solution
  pull_request:

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q 03_models scripts src

      - name: Validate committed input manifest syntax
        run: python scripts/audit_inputs.py --allow-missing --json /tmp/input-audit.json

      - name: Q1 synthetic recovery
        run: python 03_models/q1/test_synthetic.py

      - name: Q2 synthetic recovery
        run: python 03_models/q2/test_synthetic.py

      - name: Q3 synthetic recovery
        run: python 03_models/q3/test_synthetic.py

      - name: Q4 target-coverage scheduler synthetic test
        run: python 03_models/q4/test_synthetic.py

      - name: Verify legacy Q4 results cannot enter paper build
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('05_results/q4/parameters.json')
          if p.exists():
              q4 = json.loads(p.read_text(encoding='utf-8'))
              if q4.get('milp', {}).get('artificial_capacity') is not None:
                  print('Legacy Q4 result is present; expected until formal unrestricted Q4 is rerun.')
          PY
