name: refresh-formal-q4

# Reusable formal-data refresh. Editing this workflow intentionally triggers one run.
on:
  workflow_dispatch:
  push:
    branches:
      - agent/reference-submission-solution
    paths:
      - .github/workflows/refresh-formal-q4.yml

permissions:
  contents: write

jobs:
  refresh-q4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/reference-submission-solution
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Audit committed official inputs
        run: python scripts/audit_inputs.py --data-dir 00_problem/attachments

      - name: Run Q4 synthetic regression
        run: python 03_models/q4/test_synthetic.py

      - name: Recompute formal unrestricted Q4
        run: |
          python 03_models/q4/run_q4.py \
            --trajectory 05_results/q3/trajectory_10hz.csv \
            --targets 00_problem/attachments/附件4.xlsx \
            --template 00_problem/attachments/result.xlsx \
            --results 05_results/q4

      - name: Regenerate Q4 figures
        run: |
          python 03_models/q4/make_figures.py \
            --trajectory 05_results/q3/trajectory_10hz.csv \
            --targets 00_problem/attachments/附件4.xlsx \
            --results 05_results/q4 \
            --figures 06_figures/q4

      - name: Validate formal Q4
        run: |
          python 03_models/q4/validation.py \
            --trajectory 05_results/q3/trajectory_10hz.csv \
            --targets 00_problem/attachments/附件4.xlsx \
            --template 00_problem/attachments/result.xlsx \
            --results 05_results/q4 \
            --figures 06_figures/q4 \
            --output 05_results/q4/validation.json

      - name: Audit cross-problem formal result chain
        run: python scripts/audit_results.py --output-dir /tmp/formal-audit

      - name: Validate LaTeX asset generation with fresh Q4 schema
        run: python scripts/generate_latex_assets.py

      - name: Commit refreshed formal Q4 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 05_results/q4 06_figures/q4
          if git diff --cached --quiet; then
            echo "No Q4 artifact changes to commit."
          else
            git commit -m "Refresh unrestricted formal Q4 results"
            git push origin HEAD:agent/reference-submission-solution
          fi
